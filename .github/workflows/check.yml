name: 검사

on:
  pull_request:
  push:
    branches: [main, agent-supervisor]

jobs:
  base-branch:
    # Agent 과제 PR 은 무조건 agent-supervisor 로. main 은 RAG 제출본으로 동결 (CONTRIBUTING.md 2절)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR base 브랜치 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # 예외: main 의 이슈 · PR 템플릿 반영 (#50) — 템플릿은 기본 브랜치에서만 읽히기 때문
          if [ "$BASE" = "main" ] && [ "$HEAD" != "chore/50-agent-templates" ]; then
            echo "::error::PR base 가 main 입니다. Agent 과제 PR 은 base 를 agent-supervisor 로 바꾸세요 (PR 화면 위 'Edit' → base 드롭다운)."
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API 키 하드코딩 검사
        run: |
          if grep -rnE "sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{10,}|lsv2_[A-Za-z0-9_-]{10,}" \
               --include='*.py' --include='*.md' --include='*.yaml' --include='*.yml' --include='*.json' \
               --exclude-dir=.git --exclude-dir=.venv . ; then
            echo "::error::API 키가 코드에 들어 있습니다. .env 로 옮기세요."; exit 1
          fi

      - name: 커밋 금지 파일 검사
        run: |
          bad=$(git ls-files | grep -E '^(\.env$|data/papers/.*\.pdf$|data/index/|data/cache/|reference/)' || true)
          if [ -n "$bad" ]; then echo "::error::커밋하면 안 되는 파일: $bad"; exit 1; fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true            # torch 등 무거운 의존성은 캐시 — 첫 실행만 몇 분
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 문법 · import 순서 (ruff)
        run: uvx ruff check .

      - name: 의존성 설치 (pyproject 기준 — 워커가 무엇을 import 하든 테스트가 돈다)
        # 전에는 langgraph + langchain-openai 만 설치했는데, 워커가 rag.* 를 끌어오면서
        # tests/test_domain.py 가 langchain_chroma 를 못 찾아 main 이 #25 부터 빨갔다 (2026-09-22)
        run: uv sync --group dev

      - name: 단위 테스트 (LLM · 모델 다운로드 없이 도는 것만)
        run: uv run pytest -q tests
