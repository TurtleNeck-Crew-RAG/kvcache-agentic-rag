name: "🐛 Bug"
description: "동작하지 않는 것"
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        > **Agent 과제(`agent-supervisor`) 작업입니다.** 기본 브랜치가 `agent-supervisor` 라서
        > **Development → Create a branch** 로 만들면 자동으로 여기서 갈라지고, PR base 도 기본값으로 잡힙니다.
        > `main` 은 RAG 제출본으로 동결. PR 본문의 `closes #N` 으로 머지 시 이 이슈가 자동으로 닫힙니다.

  - type: dropdown
    id: area
    attributes:
      label: 어느 파트
      description: 소유자가 고칩니다. 남의 디렉토리를 직접 고치지 마세요.
      options:
        - "A 충분성 판정·관측성·기술조사 (graph/sufficiency · graph/observe · rag/ · agents/tech_research)"
        - "B 시장·이해관계자·보고서 (agents/market · agents/stakeholder · agents/report)"
        - "C 품질평가·도메인·종합 (agents/evaluator · agents/domain · agents/synthesis)"
        - "D Supervisor·State·Graph (graph/supervisor · graph/state · graph/build · graph/safe · app.py)"
        - "공용 (config · scripts · CI)"
        - "모르겠음"
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇이 어떻게 안 되나요? State 의 어느 키가 기대와 다른가요?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: |
        1. `bash scripts/fetch_papers.sh && python -m rag.indexing`
        2. `python app.py` (또는 `pytest tests/...`)
        3.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 에러 / LangSmith 트레이스
      description: 트레이스백 전문(길면 마지막 20줄) 또는 LangSmith 실행 링크 (프로젝트 kv-cache-eval)
      render: shell

  - type: checkboxes
    id: checked
    attributes:
      label: 확인한 것
      options:
        - label: "최신 `main` 에서도 재현됩니다"
        - label: "`.env` 키(OPENAI · TAVILY)가 들어 있고 `uv sync` 를 했습니다"
        - label: "`data/papers/*.pdf` 2개와 `data/index/` 가 있습니다 (RAG 관련일 때)"
