[project]
name = "kvcache-agentic-rag"
version = "0.1.0"
description = "KV cache 최적화 기술(KIVI vs InfiniGen) 다관점 평가 Agentic RAG — SKALA 판교 10반"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 그래프 · LLM
    "langgraph>=1.0.1",
    "langchain>=1.0.2",
    "langchain-openai>=1.0.1",
    "langchain-community>=0.3.31,<0.4.2",   # 0.4.2 에서 chat_models.vertexai 삭제 → ragas 0.4.3 import 깨짐
    "langchain-classic>=1.0.0",     # CacheBackedEmbeddings · LocalFileStore (langchain 1.x 에서 분리)
    # RAG 파이프라인 (설계서 3.4 · 3.6)
    "langchain-huggingface>=0.3.0",
    "sentence-transformers>=5.1.1",
    "FlagEmbedding>=1.3.0",        # BGE-M3 sparse (learned sparse) — BM25 와 비교 후 확정
    "rank-bm25>=0.2.2",
    "chromadb>=1.0.0",
    "langchain-chroma>=0.2.0",
    "pymupdf>=1.26.0",
    # 웹 검색
    "langchain-tavily>=0.2.12",
    "tavily-python>=0.5.0",
    # 평가
    "ragas>=0.3.0",
    "markdown>=3.7",
    # 공통
    "python-dotenv>=1.1.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 보고서 md → PDF. weasyprint 는 시스템 라이브러리(pango) 필요: brew install pango
# 안 되면 VS Code "Markdown PDF" 확장 등으로 수동 변환해도 됨 (D 담당)
pdf = ["weasyprint>=65.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["experiments"]   # 실측 스크립트는 그대로 둠

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
