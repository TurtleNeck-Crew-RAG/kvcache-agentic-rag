# 설계서 1장 — 대상 기술 선정 (State.selected 로 로드)
# 선정 방식: 2안 Human — 조가 기준표로 6편 비교 후 선정 (설계서 3.2)
sw:
  name: KIVI
  authors: "Liu, Z., Yuan, J., Jin, H. et al."
  paper: "KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache"
  arxiv: "2402.02750"
  venue: "ICML 2024, PMLR 235"
  pages: 15
  reason: >-
    사후·무보정 2bit KV 양자화. 재학습·보정 데이터 없이 배포된 모델에 즉시 적용 가능,
    피크 메모리 2.6x 감소. 정확도 trade-off 가 관점 대조 재료 (설계서 1.3)

hw:
  name: InfiniGen
  authors: "Lee, W., Lee, J., Seo, J., Sim, J."
  paper: "InfiniGen: Efficient Generative Inference of Large Language Models with Dynamic KV Cache Management"
  arxiv: "2406.19707"
  venue: "OSDI 2024"
  pages: 18
  reason: >-
    동적 KV 오프로딩·프리패치. 전용 HW 없이 메모리 계층을 쓰는 유일한 후보,
    정확도 무손실 vs 전송·전력 비용 (설계서 1.4)

# 설계서 1.1 선정 기준표
criteria:
  - key: on_device_applicability
    label: 온디바이스 적용 가능성
    question: 별도의 학습이나 전용 하드웨어 없이 기존 모델에 적용할 수 있는가
  - key: evidence_availability
    label: 평가 자료 확보 가능성
    question: 오픈소스 구현·후속 연구·개발자 논의·제품 적용 사례가 충분한가
  - key: maturity
    label: 기술 성숙도
    question: TRL 기준 성숙 수준이 비교 가능한가, 공개 시점 차이로 불공정하지 않은가
  - key: corpus_fit
    label: RAG Corpus 적합성
    question: KV cache 가 논문의 주제인가, 2편 합쳐 200p 이내인가

